schema_version: 1

context:
  version: "0.2.1"
  abi3_python: '3.12'

package:
  name: triangular
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/triangular/triangular-${{ version }}.tar.gz
  sha256: 1f7a0ea56a106dd955c08c4259f32c627514f4671fc853ff6c6e59cccb356e7e

build:
  number: 0
  skip: match(python, "!=${{ abi3_python }}")
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    version_independent: true

requirements:
  build:
    # NOTE: For cross-compilation, we need the Python interpreter's headers and
    # stuff (cross-python_*) for the target architecture.
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.7,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python-abi3
    - python
    - maturin >=1.7,<2
    - pip
  run:
    - python
    - numpy >=1.23

tests:
  - python:
      python_version:
        - ${{ abi3_python }}.*
        - "*"
      imports:
        - triangular
        - triangular._triangular
      pip_check: true
  - requirements:
      run:
        - abi3audit
    script:
      - if: unix
        then: abi3audit $SP_DIR/triangular/_triangular.abi3.so -s -v --assume-minimum-abi3 ${{ abi3_python }}
        else: abi3audit %SP_DIR%\triangular\_triangular.pyd -s -v --assume-minimum-abi3 ${{ abi3_python }}


about:
  summary: 2-D Delaunay triangulation and convex hull, API-compatible with the triangle library.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/earth-mover/triangular
  repository: https://github.com/earth-mover/triangular

extra:
  recipe-maintainers:
    - martinRenou
    - samantha-earthmover
